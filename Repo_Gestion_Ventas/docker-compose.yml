services:
  db:
    image: mysql:8.0
    container_name: gestion_ventas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_ventas
      MYSQL_USER: ventas
      MYSQL_PASSWORD: ventas123
      TZ: Europe/Madrid
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Los .sql de esta carpeta se ejecutan solo la PRIMERA vez (con el volumen vacío)
      - ./sql:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: gestion_ventas_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8081:80"

volumes:
  db_data:
